<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Hanzz Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  text-align:center;
  background:#111827;
  padding:25px;
  border-radius:15px;
  width:90%;
  max-width:350px;
  box-shadow:0 0 15px rgba(255,255,255,0.1);
}

button{
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#4285F4;
  color:white;
  cursor:pointer;
  margin-top:10px;
}
</style>

</head>
<body>

<div class="box">
  <h2>🚀 Hanzz Store Login</h2>
  <p>Login pakai akun Google</p>

  <button onclick="loginGoogle()">🔑 Login dengan Google</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 GANTI INI NANTI DENGAN FIREBASE PUNYAMU
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginGoogle = function(){
  signInWithPopup(auth, provider)
  .then((result) => {
    const user = result.user;

    // cek admin atau user
    if(user.email === "admin@gmail.com"){
      alert("Login sebagai ADMIN 🔐");
      window.location.href = "admin.html";
    } else {
      alert("Login sebagai USER 👤");
      window.location.href = "index.html";
    }
  })
  .catch((error) => {
    alert("Login gagal ❌");
  });
}
</script>

</body>
</html>
